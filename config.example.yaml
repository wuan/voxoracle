# VoxOracle example configuration.
#
# Copy this file to config.yaml and adjust it for your device:
#
#   cp config.example.yaml config.yaml
#
# config.yaml is git-ignored. Keep API keys in the environment (or a .env
# file); never commit credentials directly to config.yaml.
#
# Environment overrides use the VXORACLE_ prefix with "__" between sections and
# keys, e.g. VXORACLE_DOCORACLE__URL. The environment wins over this file.

docoracle:
  # Base URL of the running DocOracle server.
  url: http://localhost:8000
  # Seconds to wait for POST /ask before timing out.
  timeout: 60

audio:
  # ALSA/PipeWire device names, or "default" for the system default device.
  input_device: default
  output_device: default
  # Capture sample rate in Hz (16 kHz mono is required for speech).
  sample_rate: 16000
  # Audio frame size in milliseconds.
  frame_ms: 30
  # WebRTC VAD aggressiveness in [0, 3]; higher filters more non-speech.
  vad_aggressiveness: 2
  # Silence after speech, in milliseconds, that ends an utterance.
  endpoint_silence_ms: 700

wakeword:
  # Trained activation model (required). "hey-franz" resolves to
  # <models_dir>/hey-franz.onnx. There is no placeholder: doctor and startup
  # fail fast until the model trained with livekit-wakeword is installed
  # (train off-device; recipe in training/hey-franz.yaml).
  model: hey-franz
  # Directory searched for <model>.onnx when "model" is a bare name.
  models_dir: models
  # Detection threshold in [0, 1]; higher reduces false activations. The
  # conv-attention model's operating point sits well above the old 0.5 default;
  # this interim value matches upstream (~0.68) and is finalized from the
  # trained model's eval output.
  threshold: 0.68
  # Score the rolling ~2 s audio window every N capture frames (30 ms each).
  # Higher strides save CPU on the Pi 3 at the cost of detection latency.
  stride_frames: 4

# Shared Mistral cloud credentials/endpoint, used by both STT (Voxtral) and TTS.
# Prefer the environment (or a .env file) over this file for the key:
#   VXORACLE_MISTRAL__API_KEY, or MISTRAL_API_KEY / LLM_API_KEY (the key
#   DocOracle already uses, so one Mistral key covers everything). All of these
#   are read from a real env var or from .env. Never commit a key to config.yaml.
mistral:
  base_url: https://api.mistral.ai/v1
  api_key: null
  # Request timeout and retry count for STT and TTS (owned by the shared client).
  timeout: 30
  retries: 2

stt:
  # Cloud speech-to-text provider.
  provider: mistral
  # Transcription model (Voxtral Mini Transcribe 2).
  model: voxtral-mini-latest
  # BCP-47 language tag; German first.
  language: de

tts:
  # Cloud text-to-speech provider (Mistral Voxtral speech synthesis).
  provider: mistral
  # Speech-synthesis model.
  model: voxtral-mini-tts-2603
  # BCP-47 language tag; German first. Also selects the default voice when voice
  # is null (Mistral has no language field and picks the voice by voice_id).
  language: de
  # Provider voice id; null uses the German default from the language above.
  # Confirmed on-device during WP7 (set an explicit voice id if it differs).
  voice: null
  # Sample rate (Hz) of the provider's PCM audio. Mistral does not publish it;
  # correct it here if the device plays at the wrong speed (confirmed in WP7).
  sample_rate: 24000

session:
  # Maximum length of a single spoken question, in seconds.
  max_record_seconds: 15
  # Keep listening briefly after an answer for a follow-up question.
  follow_up: false
  # Seconds the follow-up listening window stays open after an answer; 0 also
  # disables it. Only used when follow_up is true.
  follow_up_seconds: 10
  # Stop playback when the wake word or speech is detected.
  barge_in: true

logging:
  # One of: DEBUG, INFO, WARNING, ERROR, CRITICAL.
  level: INFO
