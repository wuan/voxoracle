[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voxoracle"
version = "0.1.0"
description = "Headless, voice-only frontend for DocOracle running on a Raspberry Pi"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "Andreas Würl", email = "andi@tryb.de"}
]

dependencies = [
    "httpx>=0.27",
    "numpy>=2.5.3",
    "openwakeword>=0.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "sounddevice>=0.5.6",
    "typer>=0.12.0",
    "webrtcvad-wheels>=2.0.14.post1",
]

[project.scripts]
voxoracle = "voxoracle.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3.5",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "basedpyright>=1.0.0",
    "pre-commit>=3.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["voxoracle*"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.basedpyright]
pythonVersion = "3.13"
typeCheckingMode = "strict"
reportGeneralTypeIssues = true
exclude = ["tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["voxoracle"]
