name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    name: lint, type-check, test & validate specs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Sync dependencies
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (basedpyright)
        run: uv run basedpyright

      - name: Test (pytest)
        run: uv run pytest --cov=voxoracle --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 5

      - name: Install OpenSpec
        run: npm install -g @fission-ai/openspec@1.14.1

      - name: Validate specs (openspec)
        run: openspec validate --all --strict

  sonar:
    name: sonarcloud analysis
    runs-on: ubuntu-latest
    needs: ci
    permissions:
      contents: read
      pull-requests: read
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v8
        with:
          name: coverage-report
          path: .

      - name: SonarCloud Scan
        if: env.SONAR_TOKEN != ''
        uses: sonarsource/sonarqube-scan-action@v8.3.0
        with:
          args: >
            -Dsonar.host.url=https://sonarcloud.io
            -Dsonar.organization=wuan
            -Dsonar.projectKey=wuan_voxoracle
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.coverage.reportPaths=coverage.xml
